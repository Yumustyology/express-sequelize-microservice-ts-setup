version: "3.9"

services:
  # ===================== API GATEWAY =====================
  api-gateway:
    build:
      context: ..
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "4000:4000"
    env_file:
      - ./api-gateway/.env.docker
    depends_on:
      users-service:
        condition: service_started
      posts-service:
        condition: service_started
    restart: always
    networks:
      - app-network

  # ===================== USERS SERVICE =====================
  users-service:
    build:
      context: ..
      dockerfile: ./services/users-service/Dockerfile
    container_name: users-service
    ports:
      - "4001:4001"
    env_file:
      - ./users-service/.env.docker
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mysql-users:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  # ===================== POSTS SERVICE =====================
  posts-service:
    build:
      context: ..
      dockerfile: ./services/posts-service/Dockerfile
    container_name: posts-service
    ports:
      - "4002:4002"
    env_file:
      - ./posts-service/.env.docker
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mysql-posts:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  # ===================== MYSQL USERS =====================
  mysql-users:
    image: mysql:8.0
    container_name: mysql-users
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: users_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pexample"]
      timeout: 10s
      retries: 10
    networks:
      - app-network

  # ===================== MYSQL POSTS =====================
  mysql-posts:
    image: mysql:8.0
    container_name: mysql-posts
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: posts_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - mysql_posts_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pexample"]
      timeout: 10s
      retries: 10
    networks:
      - app-network

  # ===================== REDIS =====================
  redis:
    image: redis:alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    restart: always
    networks:
      - app-network

  # ===================== RABBITMQ =====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbit
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # RABBITMQ_LOAD_DEFINITIONS: "/etc/rabbitmq/definitions.json"
      # RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management load_definitions /etc/rabbitmq/definitions.json"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

# ===================== VOLUMES =====================
volumes:
  mysql_users_data:
  mysql_posts_data:
  rabbitmq_data:

# ===================== NETWORK =====================
networks:
  app-network:
    driver: bridge
